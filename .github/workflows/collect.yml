name: Collect WoW Forever updates

on:
  schedule:
    # Every 6 hours, at minute 17 to avoid the top-of-hour rush.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run collector
        run: npx tsx scripts/pipeline/collect.ts

      - name: Commit changes
        run: |
          # data/ is created by every non-dry run; git add data/ tolerates a missing feed.json on the first run.
          git add data/
          if git diff --cached --quiet; then
            echo "No new updates."
            exit 0
          fi
          git config user.name "hearthledger-bot"
          git config user.email "hearthledger-bot@users.noreply.github.com"
          git commit -m "Update WoW Forever feed ($(date -u +%Y-%m-%d))"
          git push
